[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "backgrounder"
version = "0.1.0"
description = "SOTA background removal pipeline: BiRefNet + BEN2 alpha matting"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.1.0",
    "torchvision>=0.16.0",
    "transformers>=4.40.0",
    "huggingface_hub>=0.22.0",
    "Pillow>=10.0.0",
    "numpy>=1.24.0",
    "scipy>=1.11.0",
    "click>=8.1.0",
    "tqdm>=4.66.0",
    "einops>=0.7.0",
    "kornia>=0.7.0",
    "timm>=0.9.0",
]

[project.optional-dependencies]
inspyrenet = ["transparent-background>=1.2.0"]
ui = ["gradio>=4.0.0"]
sdmatte = [
    "diffusers>=0.30.3",
    "accelerate>=0.34.2",
    "easydict>=1.13",
    "fairscale>=0.4.13",
    "opencv-python>=4.5.4",
    "scikit-image>=0.24.0",
]
sam3 = ["sam3 @ git+https://github.com/facebookresearch/sam3.git"]
dev = ["pytest>=7.0", "black>=24.0", "ruff>=0.4.0"]

[project.scripts]
backgrounder = "backgrounder.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["backgrounder*"]

[tool.ruff.lint]
select = ["E", "F", "I"]
