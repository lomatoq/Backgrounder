[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "backgrounder"
version = "0.1.0"
description = "SOTA background removal pipeline: BiRefNet + BEN2 + depth-aware refinement"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.1.0",
    "torchvision>=0.16.0",
    "transformers>=4.40.0",
    "huggingface_hub>=0.22.0",
    "Pillow>=10.0.0",
    "numpy>=1.24.0",
    "scipy>=1.11.0",
    "click>=8.1.0",
    "tqdm>=4.66.0",
]

[project.optional-dependencies]
inspyrenet = ["transparent-background>=1.2.0"]
ui = ["gradio>=4.0.0"]
dev = ["pytest>=7.0", "black>=24.0", "ruff>=0.4.0"]

[project.scripts]
backgrounder = "backgrounder.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["backgrounder*"]

[tool.ruff.lint]
select = ["E", "F", "I"]
